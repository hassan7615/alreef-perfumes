<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عطور الريف | ALREEF PERFUMES</title>

<style>
:root{--gold:#d9ae60;--bg:#12100e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f9f1e4;font-family:Tahoma,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;padding:19px 7%;background:#15120f;position:sticky;top:0;z-index:2;border-bottom:1px solid #554128}
.brand{color:var(--gold);font-size:24px;font-weight:bold}
nav a{color:#f4e9d4;text-decoration:none;margin:0 12px}
button{background:var(--gold);border:0;border-radius:6px;padding:12px 20px;cursor:pointer;font-weight:bold;color:#21180c}
button:disabled{opacity:.5;cursor:not-allowed}
.hero{min-height:520px;background:linear-gradient(90deg,rgba(15,11,8,.1),rgba(15,11,8,.82)),url('hero.png') center/cover;display:flex;align-items:center;padding:8%}
.hero-content{max-width:470px;background:#100d09a8;padding:25px;border-radius:12px}
.hero h1{font-size:clamp(32px,5vw,60px);color:var(--gold);margin:0}
.hero p{line-height:2}
.section{padding:65px 7%;text-align:center}
h2{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:35px}
.card{background:#211b16;border:1px solid #5b4528;border-radius:12px;padding:24px}
.bottle{font-size:80px;padding:30px;background:radial-gradient(circle,#614323,#231b14);border-radius:10px}
.price{color:var(--gold);font-weight:bold;font-size:22px}
.cart{position:fixed;bottom:20px;left:20px;background:var(--gold);color:#21180c;padding:15px;border-radius:30px;box-shadow:0 5px 30px #0009}
footer{text-align:center;padding:35px;border-top:1px solid #4c3922;color:#cdbb9e}
@media(max-width:650px){nav{display:none}.hero{min-height:430px;background-position:65% center}.hero-content{padding:16px}}
</style>
</head>

<body>
<header>
<div class="brand">عطور الريف ✦</div>
<nav>
<a href="#home">الرئيسية</a>
<a href="#products">العطور</a>
<a href="#about">من نحن</a>
</nav>
<button onclick="showCart()">السلة (<span id="count">0</span>)</button>
</header>

<section class="hero" id="home">
<div class="hero-content">
<h1>عطور الريف</h1>
<p>عبير أصيل من قلب الطبيعة<br>عطور فاخرة مستوحاة من جمال الطبيعة وعبق التراث العربي.</p>
<a href="#products"><button>تسوق الآن ←</button></a>
</div>
</section>

<section class="section" id="products">
<h2>مجموعتنا المختارة</h2>
<p>اكتشف عطور الريف الفاخرة</p>
<div class="grid" id="items">جارٍ تحميل المنتجات...</div>
</section>

<section class="section" id="about">
<h2>عن عطور الريف</h2>
<p>هوية عطرية عربية تجمع الأصالة والفخامة.</p>
</section>

<footer>© 2026 عطور الريف — جميع الحقوق محفوظة</footer>

<button class="cart" onclick="showCart()">🛒 السلة: <span id="total">0</span> ر.س</button>

<script>
const SUPABASE_URL = "https://tymlbijnrjzeojnfbivb.supabase.co";
const SUPABASE_KEY = "sb_publishable_oOMBvhSlla4O7d4QQ4jhAw_0gD0tQD0";

let products = [];
let cart = [];

async function loadProducts() {
  const container = document.getElementById("items");

  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/products?select=id,name,description,price,stock&is_active=eq.true&order=created_at.asc`,
      {
        headers: {
          "apikey": SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error("Failed to load products: " + response.status);
    }

    products = await response.json();
    container.replaceChildren();

    if (products.length === 0) {
      container.textContent = "لا توجد منتجات متاحة حاليًا.";
      return;
    }

    products.forEach((p, i) => {
      const card = document.createElement("article");
      card.className = "card";

      const bottle = document.createElement("div");
      bottle.className = "bottle";
      bottle.textContent = "♜";

      const name = document.createElement("h3");
      name.textContent = p.name;

      const desc = document.createElement("p");
      desc.textContent = p.description || "";

      const price = document.createElement("p");
      price.className = "price";
      price.textContent = `${p.price} ر.س`;

      const button = document.createElement("button");
      button.textContent = p.stock > 0 ? "أضف للسلة" : "نفدت الكمية";
      button.disabled = p.stock <= 0;
      button.addEventListener("click", () => add(i));

      card.append(bottle, name, desc, price, button);
      container.appendChild(card);
    });

  } catch (error) {
    console.error(error);
    container.textContent = "تعذر تحميل المنتجات. حاول تحديث الصفحة.";
  }
}

function add(i) {
  const product = products[i];
  const inCart = cart.filter(p => p.id === product.id).length;

  if (inCart >= product.stock) {
    alert("لا توجد كمية إضافية متاحة.");
    return;
  }

  cart.push(product);
  document.getElementById("count").textContent = cart.length;
  document.getElementById("total").textContent =
    cart.reduce((sum, p) => sum + Number(p.price), 0);
}

function showCart() {
  if (!cart.length) {
    alert("السلة فارغة. أضف عطرًا أولاً.");
    return;
  }

  const details = cart.map(p =>
    `${p.name} — ${p.price} ر.س`
  ).join("\n");

  const total = cart.reduce((sum, p) => sum + Number(p.price), 0);

  alert(`سلتك التجريبية:\n${details}\nالإجمالي: ${total} ر.س`);
}

loadProducts();
</script>
</body>
</html>
